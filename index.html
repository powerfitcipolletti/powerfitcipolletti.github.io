<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>PowerFit Cipolletti · Turnos</title>
<style>
  /* ====== COLORES (cambialos acá) ====== */
  :root{
    --bg:#07090D; --card:#0f1520; --card2:#16202f; --line:#233047;
    --text:#f3f5f9; --muted:#8e9ab0; --accent:#1565FF; --accent2:#2B7BFF; --accent-text:#fff;
    --ok:#3ddc84; --warn:#ffb020; --bad:#ff5a5f; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
  body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px}
  input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
  textarea{min-height:80px;resize:vertical}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  header.top{position:sticky;top:0;z-index:5;background:rgba(13,13,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

  .logo{display:inline-flex;align-items:center;gap:6px;line-height:1}
  .logo svg{height:1.15em;width:auto;flex:0 0 auto}
  .logo .w{display:flex;flex-direction:column;align-items:flex-start}
  .logo .pf{font-weight:900;font-style:italic;font-size:22px;letter-spacing:.01em;transform:scaleX(.76);transform-origin:left center;margin-right:-.24em;white-space:nowrap}
  .logo .pf span{color:var(--accent2)}
  .logo .ci{font-size:9px;letter-spacing:.32em;color:var(--muted);font-weight:600;margin-top:3px}
  .tit{font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.01em;display:inline-block;transform:scaleX(.82);transform-origin:left center}
  .sub{color:var(--muted);font-size:13px}
  .btn{background:var(--accent);color:var(--accent-text);padding:12px 16px;font-weight:700}
  .btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}

  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .grow{flex:1}

  .badge.prueba{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:700;font-size:10px;padding:2px 6px}
  .badge.ok{color:var(--ok);border-color:var(--ok)} .badge.warn{color:var(--warn);border-color:var(--warn)} .badge.bad{color:var(--bad);border-color:var(--bad)}
  .days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}

  .slot{background:var(--card);border:1px solid var(--line);color:var(--text);padding:10px 6px;text-align:center}
  .slot b{display:block;font-size:17px}

  .note{background:var(--card2);border-left:3px solid var(--warn);padding:10px 12px;border-radius:8px;font-size:14px;margin:8px 0}
  .note.acc{border-left-color:var(--accent)}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 4px}
  .tab{background:var(--card);color:var(--muted);border:1px solid var(--line);padding:9px 14px;flex:0 0 auto}
  .tab.sel{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:700}

  .person{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--card2);border-radius:10px;padding:8px 10px;margin-top:6px}

  .att.no{background:var(--bad);color:#111;border-color:var(--bad)}
  .x{background:none;color:var(--muted);font-size:20px;padding:0 6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .chk{display:flex;align-items:center;gap:8px;margin:12px 0;color:var(--text);font-size:15px}
  .chk input{width:auto}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:50}
  #modal.on{display:flex}
  #modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  @media (min-width:600px){#modal{align-items:center} #modal .box{border-radius:18px}}
  #modal h3{font-size:18px;margin-bottom:8px}
  #modal .acts{display:flex;gap:8px;margin-top:16px}
  #modal .acts .btn{flex:1}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15px;max-width:90%;display:none;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  #toast.on{display:block}
  .center{text-align:center}
  .login{min-height:85vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:24px}
  .login .logo{font-size:40px}
  .login .logo .pf{font-size:40px}
  .login .logo .ci{font-size:12px}
  .gbtn{display:flex;align-items:center;gap:10px;background:#fff;color:#222;padding:12px 18px;font-weight:600}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .empty{color:var(--muted);text-align:center;padding:18px 0}
  .demo-bar{background:var(--warn);color:#111;text-align:center;font-size:13px;padding:6px;font-weight:600}
</style>
</head>

<script type="module">
/* =====================================================================
   CONFIGURACIÓN — completá esto con los datos de tu proyecto de Firebase
   (ver GUIA.md). Si queda vacío, la app funciona en MODO DEMO.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA3vWtS0Y2i4o4zxqx-6hMQxt6xl7Jye_k",
  authDomain: "powerfit-cipolletti.firebaseapp.com",
  projectId: "powerfit-cipolletti",
  appId: "1:269114250182:web:e9cbf4f12dd28ef89818c7"
};
// Cuentas de Google que entran al panel de administración
// Quién es dueña lo deciden las reglas de seguridad de Firebase (ahí están los mails de las dueñas).
// Esta lista solo se usa en el modo demo.
const ADMINS = ["powerfitcipolletti@gmail.com"];
const WHATSAPP = "5492996904735"; // 299 690-4735
// URL del Apps Script (cuenta powerfitcipolletti) que manda el mail de confirmación de la clase de prueba
const CONFIRMACION_URL = "";
const GIMNASIO = "PowerFit Cipolletti";

// Valores por defecto (después se cambian desde el panel → Ajustes)
const DEFAULT_CFG = {
  capacidad: 2,            // personas por turno
  intervalo: 30,           // un turno cada X minutos
  duracion: 20,            // duración de la clase en minutos
  cancelMin: 60,           // minutos de anticipación para cancelar o cambiar
  diasAnticipacion: 30,    // cuántos días hacia adelante se puede reservar
  maxSemana: 3,            // turnos máximos por semana, igual para todos los planes (permite recuperar)
  maxSeguidos: 2,          // máximo de días seguidos (2 = se permite como excepción, nunca 3)
  horarios: { // 0=domingo … 6=sábado. Formato "09:00-11:00, 16:00-21:00"
    "0": "", "1": "09:00-11:00, 16:00-21:00", "2": "09:00-11:00, 16:00-21:00",
    "3": "09:00-11:00, 16:00-21:00", "4": "09:00-11:00, 16:00-21:00",
    "5": "09:00-11:00, 16:00-21:00", "6": ""
  }
};
// Planes vigentes (precio por mes). El tope semanal de reservas es igual para todos (ver maxSemana en Ajustes).
const PLANES = [
  {id:"1x", nombre:"1 vez por semana", veces:1, cupoMes:4, precio:150000},
  {id:"2x", nombre:"2 veces por semana", veces:2, cupoMes:8, precio:180000},
  {id:"3x", nombre:"3 veces por semana", veces:3, cupoMes:12, precio:230000}
];
// Formas de pago vigentes (no hay pago mensual). Los descuentos no son acumulables.
const PAGOS = [
  {id:"2m", nombre:"Débito cada 2 meses (−15%)", meses:2, desc:15},
  {id:"3m", nombre:"Débito cada 3 meses (−20%)", meses:3, desc:20},
  {id:"otro", nombre:"Otro", meses:0, desc:null}
];

/* ============================ LOGO ============================ */
const BOLT = `<svg viewBox="0 0 24 32" aria-hidden="true"><path fill="#1565FF" d="M14.5 0 2 18h8l-3 14L22 12h-8.5L17 0z"/></svg>`;
const LOGO = `<div class="logo">${BOLT}<div class="w"><div class="pf">POWER<span>FIT</span></div><div class="ci">CIPOLLETTI</div></div></div>`;

/* ============================ UTILIDADES ============================ */
const TZ = "-03:00";
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hoy = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
const addDays = (f, n) => { const d = new Date(f + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const addMonths = (f, n) => { const d = new Date(f + "T12:00:00Z"); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 10); };
const dow = f => new Date(f + "T12:00:00Z").getUTCDay();
const inicioMs = (f, h) => new Date(`${f}T${h}:00${TZ}`).getTime();
const slotId = (f, h) => f + "_" + h.replace(":", "");
const toMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + (m || 0); };
const fromMin = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"];
const DIAS_L = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fmtCorto = f => `${DIAS[dow(f)]} ${Number(f.slice(8))}/${Number(f.slice(5,7))}`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtLargo = f => `${cap(DIAS_L[dow(f)])} ${Number(f.slice(8))} de ${MESES[Number(f.slice(5,7))-1]}`;
const fmtFecha = f => f ? `${f.slice(8)}/${f.slice(5,7)}/${f.slice(0,4)}` : "—";
const nombreMes = ym => MESES[Number(ym.slice(5,7)) - 1];
const diasEntre = (a, b) => Math.round((new Date(b+"T12:00:00Z") - new Date(a+"T12:00:00Z")) / 864e5);
const planNombre = id => (PLANES.find(p => p.id === id) || {nombre: id || "Sin plan"}).nombre;
const pagoNombre = id => (PAGOS.find(p => p.id === id) || {nombre: id || "—"}).nombre;
const vecesSemana = a => (PLANES.find(p => p.id === a?.plan) || {}).veces || 0;
// Turnos que incluye el plan cada 30 días (cupoMes en PLANES)
const cupoMes = a => (PLANES.find(p => p.id === a?.plan) || {}).cupoMes || 0;
const fmtDM = f => `${Number(f.slice(8))}/${Number(f.slice(5,7))}`;
// Ciclo de 30 días que contiene la fecha f, contando desde el día en que pagó (inicio).
// Si paga 2 o 3 meses, tiene 2 o 3 ciclos seguidos de 30 días, cada uno con su cupo.
function cicloDe(a, f) {
  if (!a?.inicio) { const ym = f.slice(0, 7); return {desde: ym + "-01", hasta: ym + "-31"}; }
  let n = Math.max(0, Math.floor(diasEntre(a.inicio, f) / 30));
  // El último ciclo del período pago llega hasta el vencimiento (así no aparece un ciclo extra por 1 o 2 días sueltos)
  const ciclos = a.vence && a.vence >= a.inicio ? Math.max(1, Math.round((diasEntre(a.inicio, a.vence) + 1) / 30)) : 0;
  if (ciclos && a.vence >= f) n = Math.min(n, ciclos - 1);
  const desde = addDays(a.inicio, n * 30);
  const hasta = ciclos && n === ciclos - 1 && a.vence >= f ? a.vence : addDays(desde, 29);
  return {desde, hasta};
}
const enCiclo = (rs, c) => rs.filter(r => r.fecha >= c.desde && r.fecha <= c.hasta).length;
const plata = n => "$" + Math.round(n).toLocaleString("es-AR");
// Total que paga en el período según plan y forma de pago (null si no se puede calcular, ej. Pack Dra.)
function totalPeriodo(planId, pagoId) {
  const p = PLANES.find(x => x.id === planId), g = PAGOS.find(x => x.id === pagoId);
  if (!p || !g || g.desc == null || !g.meses) return null;
  return p.precio * g.meses * (1 - g.desc / 100);
}
// Lunes de la semana de una fecha (las semanas van de lunes a domingo)
const lunesDe = f => addDays(f, -((dow(f) + 6) % 7));
// Cuántos días seguidos quedarían si se suma la fecha f a las fechas que ya tiene reservadas
function rachaCon(fechas, f) {
  const s = new Set(fechas); s.add(f); let n = 1;
  for (let d = addDays(f, -1); s.has(d); d = addDays(d, -1)) n++;
  for (let d = addDays(f, 1); s.has(d); d = addDays(d, 1)) n++;
  return n;
}
const waLink = (tel, txt) => { const t = String(tel||"").replace(/\D/g,""); const n = t.startsWith("54") ? t : "549" + t; return `https://wa.me/${n}?text=${encodeURIComponent(txt||"")}`; };

function slotsDelDia(cfg, f) {
  const txt = String(cfg.horarios?.[String(dow(f))] || "").trim();
  if (!txt) return [];
  const out = new Set();
  txt.split(",").forEach(r => {
    const [a, b] = r.split("-").map(s => s && s.trim());
    if (!a || !b) return;
    for (let t = toMin(a); t + cfg.duracion <= toMin(b); t += cfg.intervalo) out.add(fromMin(t));
  });
  return [...out].sort();
}
/* Feriados nacionales (Ley 27.399 y decretos). Feriado = cerrado por defecto; día no laborable = abierto por defecto.
   Desde el panel se puede abrir o cerrar cada uno. Para sumar fechas nuevas, agregalas a esta lista. */
const FERIADOS = [
  {fecha: "2026-11-23", motivo: "Día de la Soberanía Nacional", tipo: "feriado"},
  {fecha: "2026-12-07", motivo: "Día no laborable con fines turísticos", tipo: "no laborable"},
  {fecha: "2026-12-08", motivo: "Inmaculada Concepción de María", tipo: "feriado"},
  {fecha: "2026-12-25", motivo: "Navidad", tipo: "feriado"},
  {fecha: "2027-01-01", motivo: "Año Nuevo", tipo: "feriado"},
  {fecha: "2027-02-08", motivo: "Carnaval", tipo: "feriado"},
  {fecha: "2027-02-09", motivo: "Carnaval", tipo: "feriado"},
  {fecha: "2027-03-24", motivo: "Día de la Memoria por la Verdad y la Justicia", tipo: "feriado"},
  {fecha: "2027-03-25", motivo: "Jueves Santo", tipo: "no laborable"},
  {fecha: "2027-03-26", motivo: "Viernes Santo", tipo: "feriado"},
  {fecha: "2027-04-02", motivo: "Día del Veterano y de los Caídos en Malvinas", tipo: "feriado"},
  {fecha: "2027-05-01", motivo: "Día del Trabajador", tipo: "feriado"},
  {fecha: "2027-05-25", motivo: "Revolución de Mayo", tipo: "feriado"},
  {fecha: "2027-06-20", motivo: "Paso a la Inmortalidad de Belgrano", tipo: "feriado"},
  {fecha: "2027-07-09", motivo: "Día de la Independencia", tipo: "feriado"},
  {fecha: "2027-12-08", motivo: "Inmaculada Concepción de María", tipo: "feriado"},
  {fecha: "2027-12-25", motivo: "Navidad", tipo: "feriado"}
];
const feriadoDe = f => FERIADOS.find(x => x.fecha === f);
function feriadoCerrado(f) {
  const fe = feriadoDe(f); if (!fe) return null;
  const ex = state.cfg?.feriadosEx?.[f];
  const cerrado = ex === undefined ? fe.tipo === "feriado" : ex === "cerrado";
  return cerrado ? {id: "feriado_" + f, fecha: f, desde: "", motivo: fe.motivo, feriado: true} : null;
}
function bloqueo(f, h) {
  const fc = feriadoCerrado(f); if (fc) return fc;
  return state.bloqueos.find(b => b.fecha === f && (!b.desde || h == null || (h >= b.desde && h < b.hasta)));
}
function diaBloqueado(f) { return feriadoCerrado(f) || state.bloqueos.find(b => b.fecha === f && !b.desde); }
const esPrueba = r => r.tipo === "prueba";
const nuevoIdRes = (old, sid) => esPrueba(old) ? sid + "_prueba_" + old.id.split("_prueba_")[1] : sid + "_" + old.email;

/* ============================ BACKEND DEMO ============================ */
function demoBackend() {
  const KEY = "powerfit_demo_v4";
  let S = null;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!S) S = seedDemo();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const listeners = new Set();
  const notify = () => { save(); listeners.forEach(f => f()); };
  const clone = o => JSON.parse(JSON.stringify(o));
  let me = null, cb = null;
  const count = sid => S.reservas.filter(r => r.slot === sid).length;
  const api = {
    demo: true,
    init(c) { cb = c; cb(null); },
    async login(kind) {
      me = kind === "admin" ? {email:"powerfitcipolletti@gmail.com", nombre:"PowerFit"}
         : kind === "profe" ? {email:"juli.demo@gmail.com", nombre:"Juli"} : {email:"sofia.demo@gmail.com", nombre:"Sofía"};
      cb(me);
    },
    async logout() { me = null; cb(null); },
    async reset() { S = seedDemo(); notify(); },
    async isAdmin() { return ADMINS.includes(me.email); },
    async isProfe() { return (S.profes || []).some(p => p.email === me.email); },
    async listProfes() { return clone(S.profes || []); },
    async saveProfe(p) { S.profes = (S.profes || []).filter(x => x.email !== p.email); S.profes.push(clone(p)); notify(); },
    async deleteProfe(email) { S.profes = (S.profes || []).filter(x => x.email !== email); notify(); },
    async setPago(r, v) { const x = S.reservas.find(y => y.id === r.id); if (x) { if (v == null) delete x.pago; else x.pago = clone(v); } notify(); },
    async getConfig() { return clone(S.config); },
    async saveConfig(c) { S.config = clone(c); notify(); },
    listenTurnos(desde, hasta, fn) {
      const f = () => { const m = {}; S.reservas.forEach(r => { if (r.fecha >= desde && r.fecha <= hasta) m[r.slot] = (m[r.slot] || 0) + 1; }); fn(m); };
      listeners.add(f); f(); return () => listeners.delete(f);
    },
    async misReservas() { return clone(S.reservas.filter(r => r.email === me.email)); },
    async reservasRango(d, h) { return clone(S.reservas.filter(r => r.fecha >= d && r.fecha <= h)); },
    async reservar(email, fecha, hora, o = {}) {
      const sid = slotId(fecha, hora), id = sid + "_" + email;
      if (S.reservas.some(r => r.id === id)) throw new Error("Ya tiene ese turno");
      if (!o.admin && count(sid) >= o.cap) throw new Error("Ese turno se acaba de completar");

/* ============================ BACKEND FIREBASE ============================ */
async function firebaseBackend() {
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [{initializeApp}, A, F] = await Promise.all([
    import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")
  ]);
  const app = initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(app);
  const db = F.getFirestore(app);
  const {doc, getDoc, setDoc, deleteDoc, updateDoc, collection, query, where, getDocs, onSnapshot, runTransaction, Timestamp, serverTimestamp, deleteField, limit} = F;
  let me = null;
  const plain = (id, d) => { const o = {id, ...d}; if (o.inicio?.toMillis) o.inicio = o.inicio.toMillis(); delete o.creado; return o; };
  const resData = (sid, f, h, email) => ({slot: sid, fecha: f, hora: h, email, inicio: Timestamp.fromMillis(inicioMs(f, h)), creado: serverTimestamp()});
  return {
    demo: false,
    init(cb) {
      A.getRedirectResult(auth).catch(e => console.warn(e));
      A.onAuthStateChanged(auth, u => { me = u ? {email: u.email.toLowerCase(), nombre: u.displayName || "", foto: u.photoURL} : null; cb(me); });
    },
    async login() {
      const p = new A.GoogleAuthProvider(); p.setCustomParameters({prompt: "select_account"});
      try { await A.signInWithPopup(auth, p); }
      catch (e) {
        if (["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request","auth/web-storage-unsupported"].includes(e.code)) await A.signInWithRedirect(auth, p);
        else if (e.code !== "auth/popup-closed-by-user") throw e;
      }
    },
    async logout() { await A.signOut(auth); },
    initPrueba(cb) {
      const off = A.onAuthStateChanged(auth, async u => {
        if (!u) { try { await A.signInAnonymously(auth); } catch (e) { console.error(e); cb(e); } return; }
        off(); cb();
      });
    },
    async reservarPrueba(d, cap) {
      const sid = slotId(d.fecha, d.hora), tRef = doc(db, "turnos", sid), rRef = doc(db, "reservas", sid + "_prueba_" + auth.currentUser.uid);
      await runTransaction(db, async tx => {
        const t = await tx.get(tRef);
        const n = t.exists() ? (t.data().n || 0) : 0;
        if (n >= cap) throw new Error("Ese horario se acaba de completar. Elegí otro.");
        if (t.exists()) tx.update(tRef, {n: n + 1}); else tx.set(tRef, {n: 1, fecha: d.fecha, hora: d.hora});
        tx.set(rRef, {slot: sid, fecha: d.fecha, hora: d.hora, tipo: "prueba", nombre: d.nombre, mail: d.mail || "", telefono: d.telefono, nota: d.nota,
          inicio: Timestamp.fromMillis(inicioMs(d.fecha, d.hora)), creado: serverTimestamp()});
      });
    },
    // Solo las dueñas pueden leer la lista de profes: si la lectura funciona, es dueña
    async isAdmin() { try { await getDocs(query(collection(db, "profes"), limit(1))); return true; } catch (e) { return false; } },
    async isProfe() { try { return (await getDoc(doc(db, "profes", me.email))).exists(); } catch (e) { return false; } },
    async listProfes() { return (await getDocs(collection(db, "profes"))).docs.map(d => ({email: d.id, ...d.data()})); },
    async saveProfe(p) { await setDoc(doc(db, "profes", p.email), {nombre: p.nombre || ""}); },
    async deleteProfe(email) { await deleteDoc(doc(db, "profes", email)); },
    async setPago(r, v) { await updateDoc(doc(db, "reservas", r.id), {pago: v == null ? deleteField() : v}); },
    async getConfig() {
      const s = await getDoc(doc(db, "config", "general"));
      const d = s.exists() ? s.data() : {};
      return {...DEFAULT_CFG, ...d, horarios: {...DEFAULT_CFG.horarios, ...(d.horarios || {})}, _nuevo: !s.exists()};
    },
    async saveConfig(c) { await setDoc(doc(db, "config", "general"), c); },
    listenTurnos(desde, hasta, fn) {
      const q = query(collection(db, "turnos"), where("fecha", ">=", desde), where("fecha", "<=", hasta));
      return onSnapshot(q, s => { const m = {}; s.forEach(d => m[d.id] = d.data().n || 0); fn(m); }, e => console.error(e));
    },
    async misReservas() {
      const s = await getDocs(query(collection(db, "reservas"), where("email", "==", me.email)));
      return s.docs.map(d => plain(d.id, d.data()));
    },
    async reservasRango(d, h) {
      const s = await getDocs(query(collection(db, "reservas"), where("fecha", ">=", d), where("fecha", "<=", h)));
      return s.docs.map(x => plain(x.id, x.data()));
    },
    async reservar(email, f, h, o = {}) {
      const sid = slotId(f, h), tRef = doc(db, "turnos", sid), rRef = doc(db, "reservas", sid + "_" + email);
      await runTransaction(db, async tx => {
        const t = await tx.get(tRef), r = await tx.get(rRef);
        if (r.exists()) throw new Error("Ya tiene ese turno");
        const n = t.exists() ? (t.data().n || 0) : 0;
        if (!o.admin && n >= o.cap) throw new Error("Ese turno se acaba de completar");
        if (t.exists()) tx.update(tRef, {n: n + 1}); else tx.set(tRef, {n: 1, fecha: f, hora: h});
        tx.set(rRef, resData(sid, f, h, email));
      });
    },
    async cancelar(r) {
      const tRef = doc(db, "turnos", r.slot), rRef = doc(db, "reservas", r.id);
      await runTransaction(db, async tx => {
        const t = await tx.get(tRef);
        const n = t.exists() ? (t.data().n || 0) : 0;
        tx.delete(rRef);
        if (t.exists()) tx.update(tRef, {n: Math.max(0, n - 1)});
      });
    },
    async cambiar(old, f, h, o = {}) {
      const sid = slotId(f, h);
      const oRef = doc(db, "reservas", old.id), otRef = doc(db, "turnos", old.slot);
      const nRef = doc(db, "reservas", nuevoIdRes(old, sid)), ntRef = doc(db, "turnos", sid);
      const extra = esPrueba(old) ? {tipo: "prueba", nombre: old.nombre || "", mail: old.mail || "", telefono: old.telefono || "", nota: old.nota || ""} : {};
      await runTransaction(db, async tx => {
        const ot = await tx.get(otRef), nt = await tx.get(ntRef), nr = await tx.get(nRef);
        if (nr.exists()) throw new Error("Ya tiene ese turno");
        const nn = nt.exists() ? (nt.data().n || 0) : 0;
        if (!o.admin && nn >= o.cap) throw new Error("Ese turno se acaba de completar");
        tx.delete(oRef);
        if (ot.exists()) tx.update(otRef, {n: Math.max(0, (ot.data().n || 0) - 1)});
        if (nt.exists()) tx.update(ntRef, {n: nn + 1}); else tx.set(ntRef, {n: 1, fecha: f, hora: h});
        const base = resData(sid, f, h, old.email || "");
        if (esPrueba(old)) delete base.email;
        tx.set(nRef, {...base, ...extra});
      });
    },
    async setAsistencia(r, v) { await updateDoc(doc(db, "reservas", r.id), {asistencia: v == null ? deleteField() : v}); },
    async getAlumno(email) { const s = await getDoc(doc(db, "alumnos", email)); return s.exists() ? s.data() : null; },
    async listAlumnos() { return (await getDocs(collection(db, "alumnos"))).docs.map(d => d.data()); },
    async saveAlumno(a) { await setDoc(doc(db, "alumnos", a.email), a); },
    async deleteAlumno(email) { await deleteDoc(doc(db, "alumnos", email)); },
    async listBloqueos() { return (await getDocs(collection(db, "bloqueos"))).docs.map(d => ({id: d.id, ...d.data()})); },
    async saveBloqueo(b) { const id = b.id || b.fecha + "_" + (b.desde || "todo").replace(":", ""); const {id: _, ...data} = b; await setDoc(doc(db, "bloqueos", id), data); },
    async deleteBloqueo(id) { await deleteDoc(doc(db, "bloqueos", id)); }
  };
}

function modal({title, html = "", ok = "Confirmar", cancel = "Volver", danger = false, onOpen}) {

      close(b.dataset.m === "1" ? $box : false);
    };
    onOpen && onOpen($box);
  });
}
async function run(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) { console.error(e); toast(traducirError(e)); return false; }

function traducirError(e) {
  const m = String(e?.message || e);
  if (/permission|insufficient/i.test(m)) return "No se pudo guardar: no tenés permiso o el turno ya no está disponible.";
  if (/offline|network|unavailable/i.test(m)) return "Sin conexión. Probá de nuevo en un momento.";
  return m;
}

function validarReserva(al, mis, f, h, excluirId) {
  if (!al) return "No estás dado de alta";
  if (!al.activo) return "Tu cuenta está pausada. Escribinos por WhatsApp.";
  if (al.vence && f > al.vence) return `Tu plan vence el ${fmtFecha(al.vence)}. Escribinos para renovarlo.`;
  if (inicioMs(f, h) <= Date.now()) return "Ese horario ya pasó";
  const otras = mis.filter(r => r.id !== excluirId);
  if (otras.some(r => r.fecha === f)) return "Ya tenés un turno ese día";
  const maxSeg = Number(state.cfg.maxSeguidos) || 1;
  if (rachaCon(otras.map(r => r.fecha), f) > maxSeg)
    return maxSeg === 1 ? "No se pueden reservar turnos en días seguidos" : `No se pueden reservar más de ${maxSeg} días seguidos`;
  const max = Number(state.cfg.maxSemana) || 0;
  if (max > 0) {
    const lun = lunesDe(f), usadas = otras.filter(r => lunesDe(r.fecha) === lun).length;
    if (usadas >= max) return `Podés reservar hasta ${max} turnos por semana y ya tenés ${usadas} esa semana`;
  }
  const cupo = cupoMes(al);
  if (cupo > 0) {
    const c = cicloDe(al, f), usadasC = enCiclo(otras, c);
    if (usadasC >= cupo) return `Tu plan incluye ${cupo} turnos cada 30 días y ya tenés ${usadasC} entre el ${fmtDM(c.desde)} y el ${fmtDM(c.hasta)}`;
  }
  return null;
}

    capacidad: Math.max(1, Number(g("cCap").value) || 1), intervalo: Math.max(5, Number(g("cInt").value) || 30),
    duracion: Math.max(5, Number(g("cDur").value) || 20), cancelMin: Math.max(0, Math.round(Number(g("cCan").value) || 0)),
    diasAnticipacion: Math.max(1, Number(g("cDias").value) || 30), maxSemana: Math.max(1, Number(g("cMaxSem").value) || 3), maxSeguidos: Math.max(1, Number(g("cMaxSeg").value) || 2), horarios: {},
    feriadosEx: state.cfg.feriadosEx || {}
  };
  for (let d = 0; d < 7; d++) c.horarios[String(d)] = g("cH" + d).value.trim();
  const malos = Object.values(c.horarios).filter(v => v && !v.split(",").every(r => /^\s*\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}\s*$/.test(r)));
  if (malos.length) return toast("Revisá el formato de horarios: " + malos[0]);
  if (await run(() => state.B.saveConfig(c), "Ajustes guardados")) { state.cfg = c; renderAdmin(); }
}

/* ============================ EVENTOS ============================ */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-a]"); if (!el || el.closest("#modal")) return;
  const a = el.dataset.a, B = state.B;
  switch (a) {
    case "login": run(() => B.login()); break;
    case "demoLogin": B.login(el.dataset.k); break;
    case "demoReset": if (await modal({title: "¿Reiniciar la demo?", html: "<p>Se vuelven a cargar los datos de ejemplo.</p>", ok: "Reiniciar"})) { await B.reset(); location.reload(); } break;
    case "logout": state.unsub && state.unsub(); state.unsub = null; state.cambiando = null; await B.logout(); break;
    case "prDia": pr.dia = el.dataset.f; renderPrueba(); break;
    case "prSlot": prElegir(el.dataset.f, el.dataset.h); break;
    case "prOtra": pr.listo = null; try { localStorage.removeItem(PRUEBA_KEY); } catch (e) {} renderPrueba(); break;
    case "alta": { const r = [...state.resDia, ...state.pruebas].find(x => x.id === el.dataset.id); if (r) editarAlumno(null, {nombre: r.nombre, email: r.mail || "", telefono: r.telefono, notas: r.nota}); break; }
    case "dia": state.diaSel = el.dataset.f; renderAlumno(); break;
    case "slot": clickSlot(el.dataset.f, el.dataset.h); break;
    case "cambiar": state.cambiando = state.mis.find(r => r.id === el.dataset.id); state.diaSel = null; renderAlumno(); toast("Elegí el nuevo día y horario"); break;
    case "noCambiar": state.cambiando = null; renderAlumno(); break;
    case "cancelar": {
      const r = state.mis.find(x => x.id === el.dataset.id); if (!r) return;
      if (!puedeModificar(r)) return toast("Ya no se puede cancelar este turno");
      if (await modal({title: "¿Cancelar turno?", html: `<p>${fmtLargo(r.fecha)} a las ${r.hora}</p>`, ok: "Sí, cancelar", cancel: "No", danger: true})) {
        await run(() => B.cancelar(r), "Turno cancelado"); state.cambiando = null; await refrescarMis(); }
      break; }
    case "tab": state.tab = el.dataset.t; renderAdmin(); break;
    case "agMove": state.agFecha = addDays(state.agFecha, Number(el.dataset.d)); await cargarAdmin(); renderAdmin(); break;
    case "agHoy": state.agFecha = hoy(); await cargarAdmin(); renderAdmin(); break;
    case "refresh": await cargarAdmin(); renderAdmin(); toast("Actualizado"); break;
    case "agAdd": agAgregar(el.dataset.h); break;
    case "agMover": agMover(el.dataset.id); break;
    case "agDel": {
      const r = state.resDia.find(x => x.id === el.dataset.id); if (!r) return;
      if (await modal({title: "¿Quitar del turno?", html: `<p>${esc(nombreRes(r))} · ${r.hora}</p>`, ok: "Quitar", danger: true}))
        if (await run(() => B.cancelar(r), "Turno quitado")) { await cargarAdmin(); renderAdmin(); }
      break; }
    case "pago": registrarPago(el.dataset.id); break;
    case "feriado": {
      const c = JSON.parse(JSON.stringify(state.cfg)); c.feriadosEx = {...(c.feriadosEx || {}), [el.dataset.f]: el.dataset.v};
      if (await run(() => B.saveConfig(c), el.dataset.v === "cerrado" ? "Día cerrado" : "Día abierto")) {
        state.cfg = c; await cargarAdmin(); renderAdmin();
        const rs = el.dataset.v === "cerrado" ? (await B.reservasRango(el.dataset.f, el.dataset.f)) : [];
        if (rs.length) await modal({title: "Hay turnos reservados ese día", cancel: "", ok: "Entendido",
          html: `<p class="sub">No se borran solos. Avisales y movelos desde la Agenda:</p>${rs.map(r => { const tel = telRes(r), nom = nombreRes(r);
            return `<div class="person"><span class="name">${r.hora} · ${esc(nom)}</span>${tel ? `<a class="att" target="_blank" href="${waLink(tel, `Hola ${nom.split(" ")[0]}! Te escribimos de PowerFit: el ${fmtLargo(r.fecha)} el gimnasio está cerrado. ¿Te pasamos el turno a otro día?`)}">WhatsApp</a>` : ""}</div>`; }).join("")}`});
      }
      break; }
    case "copiar": try { await navigator.clipboard.writeText(LINKS[el.dataset.k]); toast("Link copiado"); } catch (err) { toast("No se pudo copiar: copialo a mano"); } break;
    case "addProfe": addProfe(); break;
    case "delProfe": if (await modal({title: "¿Quitar profe?", html: `<p>${esc(el.dataset.e)} ya no va a poder entrar al panel.</p>`, ok: "Quitar", danger: true}))
      if (await run(() => B.deleteProfe(el.dataset.e), "Profe quitada")) { await cargarAdmin(); renderAdmin(); } break;
    case "att": {
      const r = state.resDia.find(x => x.id === el.dataset.id); if (!r) return;
      const v = el.dataset.v === "1"; const nuevo = r.asistencia === v ? null : v;
      if (await run(() => B.setAsistencia(r, nuevo))) { if (nuevo == null) delete r.asistencia; else r.asistencia = nuevo;
        const m = state.resMes.find(x => x.id === r.id); if (m) { if (nuevo == null) delete m.asistencia; else m.asistencia = nuevo; } renderAdmin(); }
      break; }
    case "verDia": state.agFecha = el.dataset.f; state.tab = "agenda"; await cargarAdmin(); renderAdmin(); break;
    case "copiarLink": try { await navigator.clipboard.writeText(location.origin + location.pathname + "#prueba"); toast("Link copiado"); } catch (err) { toast("No se pudo copiar: copialo a mano"); } break;
    case "filtro": state.filtro = el.dataset.k; renderAdmin(); break;
    case "alNuevo": editarAlumno(null); break;
    case "alEdit": editarAlumno(el.dataset.e); break;
    case "addBloq": addBloqueo(); break;
    case "delBloq": if (await run(() => B.deleteBloqueo(el.dataset.id), "Bloqueo quitado")) { await cargarAdmin(); renderAdmin(); } break;
    case "saveCfg": saveCfg(); break;
  }
});
document.addEventListener("change", async e => {
  if (e.target.id === "agDate" && e.target.value) { state.agFecha = e.target.value; await cargarAdmin(); renderAdmin(); }
  if (e.target.id === "bTodo") document.getElementById("bHoras").style.display = e.target.checked ? "none" : "grid";
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { state.q = e.target.value; state._focusQ = true; renderAdmin(); state._focusQ = false; }
});
// Refresca la vista del alumno cada minuto (para que los turnos pasados se actualicen)
setInterval(() => { if (state.user && RUTA === "alumnos" && state.alumno && !$modal.classList.contains("on")) renderAlumno(); }, 60e3);

/* ============================ ARRANQUE ============================ */
async function alEntrar(u) {
  state.user = u;
  if (!u) return renderLogin();
  $app.innerHTML = `<div class="login">${LOGO}<p class="muted">Cargando…</p></div>`;
  try {
    state.cfg = await state.B.getConfig();
    state.bloqueos = await state.B.listBloqueos();
    state.admin = await state.B.isAdmin();
    state.profe = !state.admin && await state.B.isProfe();
    state.rol = state.admin ? "admin" : state.profe ? "profe" : "alumno";
    const nuevoCfg = state.cfg._nuevo; delete state.cfg._nuevo;
    if (state.admin && nuevoCfg) await state.B.saveConfig(state.cfg); // primera vez: guarda la configuración inicial
    if (RUTA === "duenas") {
      if (state.rol === "profe") return renderSinAcceso(`Esta es la app de dueñas. Las profes tienen su propia app.`, "Ir a la app de profes", LINKS.profes);
      if (state.rol !== "admin") return renderSinAcceso(`La cuenta <b>${esc(u.email)}</b> no tiene acceso a esta app.`, "Ir a mis turnos", LINKS.alumnos);
      state.tab = "agenda"; state.agFecha = hoy(); await cargarAdmin(); return renderAdmin();
    }
    if (RUTA === "profes") {
      if (state.rol === "alumno") return renderSinAcceso(`La cuenta <b>${esc(u.email)}</b> no tiene acceso a la app de profes.`, "Ir a mis turnos", LINKS.alumnos);
      state.rol = "profe"; // las dueñas también pueden entrar, y ven exactamente lo mismo que una profe
      state.tab = "agenda"; state.agFecha = hoy(); await cargarAdmin(); return renderAdmin();
    }
    state.alumno = await state.B.getAlumno(u.email);
    if (!state.alumno && state.rol === "admin") return renderSinAcceso("Esta es la app de alumnos. La de dueñas tiene su propio link.", "Ir a la app de dueñas", LINKS.duenas);
    if (!state.alumno && state.rol === "profe") return renderSinAcceso("Esta es la app de alumnos. Las profes tienen su propia app.", "Ir a la app de profes", LINKS.profes);
    state.admin = false;
    if (!state.alumno) return renderNoAlta();
    state.mis = await state.B.misReservas();
    state.diaSel = null;
    suscribirTurnos();
    renderAlumno();
  } catch (e) {
    console.error(e);
    $app.innerHTML = `${header(u.email)}<div class="wrap"><div class="card center"><p>No se pudo cargar la información.</p><p class="sub">${esc(traducirError(e))}</p>
      <button class="btn" style="margin-top:12px" onclick="location.reload()">Reintentar</button></div></div>`;
  }
}
(async () => {
  try { state.B = FIREBASE_CONFIG.apiKey ? await firebaseBackend() : demoBackend(); }
  catch (e) { console.error(e); $app.innerHTML = `<div class="login">${LOGO}<p>No se pudo conectar. Revisá tu conexión.</p></div>`; return; }
  if (RUTA === "prueba") arrancarPrueba(); else state.B.init(alEntrar);
})();
window.addEventListener("hashchange", () => location.reload());
</script>
</body>
