<title>PowerFit Cipolletti · Turnos</title>
<style>
  /* ====== COLORES (cambialos acá) ====== */
  :root{
    --bg:#07090D; --card:#0f1520; --card2:#16202f; --line:#233047;
    --text:#f3f5f9; --muted:#8e9ab0; --accent:#1565FF; --accent2:#2B7BFF; --accent-text:#fff;
    --ok:#3ddc84; --warn:#ffb020; --bad:#ff5a5f; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
  body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px}
  input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
  textarea{min-height:80px;resize:vertical}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  header.top{position:sticky;top:0;z-index:5;background:rgba(13,13,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
  .logo{display:inline-flex;align-items:center;gap:6px;line-height:1}
  .logo svg{height:1.15em;width:auto;flex:0 0 auto}
  .logo img.bolt{height:2.3em;width:auto;flex:0 0 auto;margin-right:2px}
  .logo .w{display:flex;flex-direction:column;align-items:flex-start}
  .logo .pf{font-weight:900;font-style:italic;font-size:22px;letter-spacing:.01em;transform:scaleX(.76);transform-origin:left center;margin-right:-.24em;white-space:nowrap}
  .logo .pf span{color:var(--accent2)}
  .logo .ci{font-size:9px;letter-spacing:.32em;color:var(--muted);font-weight:600;margin-top:3px}
  .tit{font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.01em;display:inline-block;transform:scaleX(.82);transform-origin:left center}
  .sub{color:var(--muted);font-size:13px}
  .btn{background:var(--accent);color:var(--accent-text);padding:12px 16px;font-weight:700}
  .btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
  .btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
  .btn.sm{padding:7px 11px;font-size:14px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .link{background:none;color:var(--muted);text-decoration:underline;padding:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0}
  h2{font-size:22px;margin:20px 0 6px;font-weight:900;font-style:italic;text-transform:uppercase;transform:scaleX(.82);transform-origin:left center;letter-spacing:.01em}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .between{justify-content:space-between}
  .grow{flex:1}
  .badge{display:inline-block;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
  .badge.prueba{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:700;font-size:10px;padding:2px 6px}
  .badge.ok{color:var(--ok);border-color:var(--ok)} .badge.warn{color:var(--warn);border-color:var(--warn)} .badge.bad{color:var(--bad);border-color:var(--bad)}
  .days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 auto;min-width:62px;text-align:center;background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 6px}
  .day b{display:block;font-size:20px}
  .day small{color:var(--muted);font-size:12px;text-transform:uppercase}
  .day.sel{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  .day.sel small{color:var(--accent-text)}
  .day.off{opacity:.35}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .slot{background:var(--card);border:1px solid var(--line);color:var(--text);padding:10px 6px;text-align:center}
  .slot b{display:block;font-size:17px}
  .slot small{font-size:12px;color:var(--muted)}
  .slot.full,.slot.blk,.slot.past{opacity:.35}
  .slot.mine{border-color:var(--accent);color:var(--accent)}
  .slot.mine small{color:var(--accent)}
  .note{background:var(--card2);border-left:3px solid var(--warn);padding:10px 12px;border-radius:8px;font-size:14px;margin:8px 0}
  .note.acc{border-left-color:var(--accent)}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 4px}
  .tab{background:var(--card);color:var(--muted);border:1px solid var(--line);padding:9px 14px;flex:0 0 auto}
  .tab.sel{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:700}
  body.ancho .wrap{max-width:1320px}
  .semana{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 16px 12px;margin:0 -16px}
  .col{flex:1 0 236px;min-width:236px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;align-self:flex-start}
  .col.al{flex-basis:150px;min-width:150px}
  .col.hoy{border-color:var(--accent)}
  .colh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
  .colh b{text-transform:uppercase;font-size:14px;letter-spacing:.04em}
  .colh small{display:block;color:var(--muted);font-size:13px}
  .hoytag{background:var(--accent);color:var(--accent-text);font-size:10px;font-weight:800;padding:3px 7px;border-radius:99px}
  .blq{margin-top:8px;border-radius:10px;overflow:hidden;background:var(--card2);border:1px solid var(--line)}
  .blqh{background:#04060a;color:#fff;padding:7px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}
  .blqh b{font-size:15px;margin-right:4px}
  .blqh .mas{background:none;color:#fff;border:1.5px solid #fff;border-radius:50%;width:22px;height:22px;line-height:18px;padding:0;font-size:16px}
  .pp{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);width:100%;background:none;color:var(--text);text-align:left;border-radius:0}
  .pp:hover{background:rgba(255,255,255,.04)}
  .av{width:34px;height:34px;border-radius:50%;background:#1b2a55;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .av.pr{background:var(--accent)}
  .pp .nm{flex:1;min-width:0}
  .pp .nm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ok)}
  .pp .nm small{display:block;font-size:12px;color:var(--muted)}
  .libre{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);padding:5px 10px;margin-top:6px;border:1px dashed var(--line);border-radius:10px}
  .col .slot{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:6px;padding:9px 10px;text-align:left}
  .col .slot b{display:inline;font-size:15px}
  .agslot{border-bottom:1px solid var(--line);padding:10px 0}
  .agslot:last-child{border-bottom:none}
  .person{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--card2);border-radius:10px;padding:8px 10px;margin-top:6px}
  .person .name{flex:1 1 100%;color:var(--ok);font-weight:600}
  .ficha{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;font-size:14px}
  .ficha dt{color:var(--muted);font-size:12px;margin-top:8px}
  .ficha dd{margin:2px 0 0}
  .ficha .alerta{color:var(--warn);font-weight:600}
  .alf{display:inline-block;vertical-align:-2px;margin-left:5px;flex:none}
  .att{padding:6px 10px;font-size:13px;background:var(--card);color:var(--muted);border:1px solid var(--line)}
  a.att{display:inline-block;border-radius:10px;color:var(--text)}
  .att.yes{background:var(--ok);color:#111;border-color:var(--ok)}
  .att.no{background:var(--bad);color:#111;border-color:var(--bad)}
  .x{background:none;color:var(--muted);font-size:20px;padding:0 6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .chk{display:flex;align-items:center;gap:8px;margin:12px 0;color:var(--text);font-size:15px}
  .chk input{width:auto}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:50}
  #modal.on{display:flex}
  #modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  @media (min-width:600px){#modal{align-items:center} #modal .box{border-radius:18px}}
  #modal h3{font-size:18px;margin-bottom:8px}
  #modal .acts{display:flex;gap:8px;margin-top:16px}
  #modal .acts .btn{flex:1}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15px;max-width:90%;display:none;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  #toast.on{display:block}
  .center{text-align:center}
  .login{min-height:85vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:24px}
  .login .logo{font-size:40px}
  .login .logo .pf{font-size:40px}
  .login .logo .ci{font-size:12px}
  .gbtn{display:flex;align-items:center;gap:10px;background:#fff;color:#222;padding:12px 18px;font-weight:600}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .empty{color:var(--muted);text-align:center;padding:18px 0}
  .demo-bar{background:var(--warn);color:#111;text-align:center;font-size:13px;padding:6px;font-weight:600}
</style>

function cicloDe(a, f) {
  if (!a?.inicio) { const ym = f.slice(0, 7); return {desde: ym + "-01", hasta: ym + "-31"}; }
  let n = Math.max(0, Math.floor(diasEntre(a.inicio, f) / 30));
  // El último ciclo del período pago llega hasta el vencimiento (así no aparece un ciclo extra por 1 o 2 días sueltos)
  const ciclos = a.vence && a.vence >= a.inicio ? Math.max(1, Math.round((diasEntre(a.inicio, a.vence) + 1) / 30)) : 0;
  if (ciclos && a.vence >= f) n = Math.min(n, ciclos - 1);
  const desde = addDays(a.inicio, n * 30);
  const hasta = ciclos && n === ciclos - 1 && a.vence >= f ? a.vence : addDays(desde, 29);
  return {desde, hasta};

}

    async logout() { await A.signOut(auth); },
    // Ingreso con cualquier mail (Hotmail, Yahoo, etc.) y contraseña; la primera vez se confirma el mail con un link
    async loginMail(email, pass) { await A.signInWithEmailAndPassword(auth, email, pass); },

    async reservarPrueba(d, cap) {

      const pmRef = doc(db, "pruebasMail", d.mail); // una sola clase de prueba por mail
      try { await runTransaction(db, async tx => {
        const t = await tx.get(tRef);
        if ((await tx.get(pmRef)).exists()) throw new Error(MSG_PRUEBA_USADA);
        const n = t.exists() ? (t.data().n || 0) : 0;
        if (n >= cap) throw new Error("Ese horario se acaba de completar. Elegí otro.");
        if (t.exists()) tx.update(tRef, {n: n + 1}); else tx.set(tRef, {n: 1, fecha: d.fecha, hora: d.hora});
        tx.set(pmRef, {creado: serverTimestamp()});

        if (nt.exists()) tx.update(ntRef, {n: nn + 1}); else tx.set(ntRef, {n: 1, fecha: f, hora: h});

  const AUTH = {"auth/invalid-credential": "Mail o contraseña incorrectos. Si es tu primera vez, tocá «Es mi primera vez».", "auth/wrong-password": "Mail o contraseña incorrectos.",

    "auth/too-many-requests": "Demasiados intentos. Esperá unos minutos y probá de nuevo.", "auth/network-request-failed": "Sin conexión. Probá de nuevo en un momento."};
  if (AUTH[c]) return AUTH[c];

/* ============================ VISTA ALUMNO ============================ */
function validarReserva(al, mis, f, h, excluirId) {
  if (!al) return "No estás dado de alta";
  if (!al.activo) return "Tu cuenta está pausada. Escribinos por WhatsApp.";
  if (al.vence && f > al.vence) return `Tu plan vence el ${fmtFecha(al.vence)}. Escribinos para renovarlo.`;
  if (inicioMs(f, h) <= Date.now()) return "Ese horario ya pasó";
  const otras = mis.filter(r => r.id !== excluirId);
  if (otras.some(r => r.fecha === f)) return "Ya tenés un turno ese día";
  const maxSeg = Number(state.cfg.maxSeguidos) || 1;
  if (rachaCon(otras.map(r => r.fecha), f) > maxSeg)
    return maxSeg === 1 ? "No se pueden reservar turnos en días seguidos" : `No se pueden reservar más de ${maxSeg} días seguidos`;
  const max = Number(state.cfg.maxSemana) || 0;
  if (max > 0) {
    const lun = lunesDe(f), usadas = otras.filter(r => lunesDe(r.fecha) === lun).length;
    if (usadas >= max) return `Podés reservar hasta ${max} turnos por semana y ya tenés ${usadas} esa semana`;
  }
  const cupo = cupoMes(al);
  if (cupo > 0) {
    const c = cicloDe(al, f), usadasC = enCiclo(otras, c);
    if (usadasC >= cupo) return `Tu plan incluye ${cupo} turnos cada 30 días y ya tenés ${usadasC} entre el ${fmtDM(c.desde)} y el ${fmtDM(c.hasta)}`;
  }
  return null;
}
const puedeModificar = r => r.inicio - Date.now() >= state.cfg.cancelMin * 60e3;
function diasReservables() {
  const out = []; for (let i = 0; i <= state.cfg.diasAnticipacion; i++) out.push(addDays(hoy(), i)); return out;
}
function suscribirTurnos() {
  state.unsub && state.unsub();
  const d = diasReservables();
  state.unsub = state.B.listenTurnos(d[0], d[d.length - 1], m => { state.turnos = m; if (RUTA === "alumnos") renderAlumno(); });
}
function renderAlumno() {

  pintarAlumno();

}

  const f = state.diaSel, slots = slotsDelDia(cfg, f);

    return d < 0 ? `<span class="badge bad">Plan vencido</span>` : d <= 7 ? `<span class="badge warn">Vence en ${d} día${d === 1 ? "" : "s"}</span>` : `<span class="badge ok">Vence ${fmtFecha(al.vence)}</span>`; })() : "";
  const camb = state.cambiando;
  const exc = camb?.id;
  const motivoDia = slots.length ? (() => { const tmp = validarReserva(al, state.mis, f, "23:59", exc); return tmp && !/pasó/.test(tmp) ? tmp : null; })() : null;

  $app.innerHTML = `${header("Mis turnos")}<div class="wrap">
    ${avisoHorarioDic()}
    <div class="card"><div class="row between"><div><b>Hola, ${esc((al.nombre || state.user.nombre || "").split(" ")[0])}</b>
      <div class="sub">Plan ${esc(planNombre(al.plan).toLowerCase())}</div>
      <div class="sub">${cupo ? `Te quedan <b style="color:var(--text)">${Math.max(0, cupo - usadasC)}</b> de ${cupo} turnos hasta el ${fmtDM(cicHoy.hasta)}` : ""}</div></div>${venceBadge}</div></div>

    ${cardComprobante()}

    <h2>Mis próximos turnos</h2>
    ${proximos.length ? proximos.map(r => {
      const ok = puedeModificar(r);
      return `<div class="card"><div class="row between"><div><b>${fmtLargo(r.fecha)}</b><div class="sub">${r.hora} hs · ${cfg.duracion} min</div></div>
        ${ok ? `<div class="row"><button class="btn sec sm" data-a="cambiar" data-id="${esc(r.id)}">Cambiar</button><button class="btn bad sm" data-a="cancelar" data-id="${esc(r.id)}">Cancelar</button></div>`
             : `<span class="small muted">Faltan menos de ${cfg.cancelMin >= 60 ? (cfg.cancelMin / 60) + " h" : cfg.cancelMin + " min"}: para cambiarlo escribinos</span>`}
      </div></div>`; }).join("") : `<div class="empty">No tenés turnos reservados</div>`}

    <h2>${camb ? "Elegí el nuevo horario" : "Reservar turno"}</h2>
    ${camb ? `<div class="note acc">Vas a reemplazar el turno del <b>${fmtLargo(camb.fecha)} a las ${camb.hora}</b>. <button class="link" data-a="noCambiar">No cambiar</button></div>` : ""}
    ${semanaAlumna(al, camb)}

    ${ayudaWA(`Hola! Soy ${al.nombre || state.user.nombre || ""} (${state.user.email}) y tengo un problema con la app de turnos.`)}
  </div>`;
}
/* ---------- Comprobantes de transferencia ---------- */
function cardComprobante() {
  const ult = (state.comps || []).slice().sort((a, b) => (b.subido || 0) - (a.subido || 0))[0];
  const reciente = ult && Date.now() - (ult.subido || 0) < 30 * 864e5;
  const estado = !reciente ? "" : ult.estado === "pendiente" ? `<div class="note acc" style="margin:8px 0 0">🧾 Recibimos tu comprobante del ${fmtDM(ult.fecha)}. Lo estamos revisando.</div>`
    : ult.estado === "aprobado" ? `<div class="note" style="margin:8px 0 0">✅ Pago aprobado: plan renovado hasta el ${fmtFecha(ult.vence)}.</div>`
    : ult.estado === "rechazado" ? `<div class="note" style="margin:8px 0 0">No pudimos validar tu comprobante del ${fmtDM(ult.fecha)}${ult.motivo ? ": " + esc(ult.motivo) : ""}. Escribinos.</div>` : "";
  return `<div class="card"><div class="row between"><div><b>¿Pagaste por transferencia?</b>
      <div class="sub">Subí el comprobante y te renovamos el plan.</div></div>
      <button class="btn sec sm" data-a="compSubir">🧾 Subir</button></div>${estado}</div>`;
}
// Achica la foto para que entre en la base de datos (o acepta un PDF chico)
function archivoADataURL(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("No se pudo leer el archivo"));
    if (/pdf/i.test(file.type)) {
      if (file.size > 650000) return rej(new Error("El PDF es muy pesado: mandá una captura de pantalla del comprobante"));
      fr.onload = () => res(fr.result); return fr.readAsDataURL(file);
    }
    if (!/^image\//.test(file.type)) return rej(new Error("Tiene que ser una foto o un PDF"));
    fr.onload = () => {
      const im = new Image();

// Turnos de la alumna en formato semana: una columna por día, con los horarios y los lugares libres
function semanaAlumna(al, camb) {
  const cfg = state.cfg, ahora = Date.now(), dias = diasReservables(), ult = dias[dias.length - 1];
  if (!state.semAl) state.semAl = lunesDe(hoy());
  const lun = state.semAl, exc = camb?.id;
  const semDias = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(lun, i)).filter(d => d >= hoy() && d <= ult && ((dow(d) !== 0 && dow(d) !== 6) || slotsDelDia(cfg, d).length)); // sin sábados ni domingos, salvo que tengan horarios
  const col = d => {
    const slots = slotsDelDia(cfg, d), dB = diaBloqueado(d);
    const motivo = slots.length && !dB ? (() => { const t = validarReserva(al, state.mis, d, "23:59", exc); return t && !/pasó/.test(t) ? t : null; })() : null;
    return `<div class="col al ${d === hoy() ? "hoy" : ""}"><div class="colh"><div><b>${DIAS[dow(d)]}</b><small>${Number(d.slice(8))} ${MESES[Number(d.slice(5, 7)) - 1].slice(0, 3)}</small></div>${d === hoy() ? `<span class="hoytag">HOY</span>` : ""}</div>
      ${dB ? `<div class="small muted" style="padding:8px 0">Sin clases${dB.motivo ? ": " + esc(dB.motivo) : ""}</div>` : !slots.length ? `<div class="small muted" style="padding:8px 0">Sin clases</div>` : `
      ${motivo ? `<div class="small" style="color:var(--warn);margin-top:4px">${esc(motivo)}</div>` : ""}
      ${slots.map(h => {
        const sid = slotId(d, h), n = state.turnos[sid] || 0, libres = cfg.capacidad - n;
        const mine = state.mis.some(r => r.slot === sid), past = inicioMs(d, h) <= ahora, blk = bloqueo(d, h);
        const cls = mine ? "mine" : past ? "past" : blk ? "blk" : libres <= 0 ? "full" : "";
        const txt = mine ? "Tu turno" : past ? "—" : blk ? "No disp." : libres <= 0 ? "Completo" : `${libres} lugar${libres === 1 ? "" : "es"}`;
        return `<button class="slot ${cls}" data-a="slot" data-f="${d}" data-h="${h}" ${(past || blk || (libres <= 0 && !mine) || (motivo && !mine)) ? "disabled" : ""}><b>${h}</b><small>${txt}</small></button>`;
      }).join("")}`}</div>`;
  };
  return `<div class="row between" style="margin:4px 0 10px"><button class="btn sec sm" data-a="semAl" data-d="-7" ${lun <= lunesDe(hoy()) ? "disabled" : ""}>‹</button>
      <b>${rangoSemana(lun)}</b><button class="btn sec sm" data-a="semAl" data-d="7" ${addDays(lun, 7) > ult ? "disabled" : ""}>›</button></div>
    <div class="semana">${semDias.map(col).join("") || `<div class="empty">No hay días para reservar esta semana</div>`}</div>`;
}
async function refrescarMis() { state.mis = await state.B.misReservas(); state.alumno = await state.B.getAlumno(state.user.email) || state.alumno; renderAlumno(); }
async function clickSlot(f, h) {

async function agAgregar(h, fecha) {
  const f = fecha || state.agFecha;
  const ya = resPool().filter(r => r.fecha === f && r.hora === h).map(r => r.email);
  const opts = state.alumnos.filter(a => a.activo !== false && !ya.includes(a.email));
  if (!opts.length) return toast("No hay alumnos activos para agregar");
  const box = await modal({title: `Agregar a las ${h}`, html: `<p class="sub">${fmtLargo(f)}</p>
    <label>Alumno</label><select name="al">${opts.map(a => `<option value="${esc(a.email)}">${esc(a.nombre || a.email)}</option>`).join("")}</select>`, ok: "Agregar"});
  if (!box) return;
  const email = box.querySelector("[name=al]").value;
  const avisos = [];
  if (ya.length >= state.cfg.capacidad) avisos.push(`El turno ya tiene ${ya.length}/${state.cfg.capacidad} personas`);
  const mis = (await state.B.reservasRango(addDays(f, -1), addDays(f, 1))).filter(r => r.email === email);
  const mismoDia = mis.find(r => r.fecha === f);
  if (mismoDia) return modal({title: "No se puede", cancel: "", ok: "Entendido",
    html: `<p>${esc(nombreDe(email))} ya tiene turno ese día a las ${mismoDia.hora}. No se pueden dar dos turnos el mismo día a la misma persona.</p>`});
  const cerca = (await state.B.reservasRango(addDays(f, -2), addDays(f, 2))).filter(r => r.email === email).map(r => r.fecha);
  if (rachaCon(cerca, f) > (Number(state.cfg.maxSeguidos) || 1)) avisos.push(`Quedaría con más de ${state.cfg.maxSeguidos || 1} días seguidos`);
  else if (mis.length) avisos.push("Queda en días seguidos (se permite como excepción)");
  const lun = lunesDe(f), sem = (await state.B.reservasRango(lun, addDays(lun, 6))).filter(r => r.email === email).length;
  if (Number(state.cfg.maxSemana) > 0 && sem >= Number(state.cfg.maxSemana)) avisos.push(`Ya tiene ${sem} turnos esa semana (máximo ${state.cfg.maxSemana})`);
  const al = alumnoDe(email), cupo = cupoMes(al);
  if (cupo) { const c = cicloDe(al, f), n = (await state.B.reservasRango(c.desde, c.hasta)).filter(r => r.email === email).length;
    if (n >= cupo) avisos.push(`Ya usó sus ${cupo} turnos del ${fmtDM(c.desde)} al ${fmtDM(c.hasta)} (${planNombre(al.plan)})`); }
  if (avisos.length && !await modal({title: "Atención", html: `<p>${avisos.map(esc).join("<br>")}</p><p class="sub" style="margin-top:8px">Podés agregarlo igual.</p>`, ok: "Agregar igual"})) return;
  if (await run(() => state.B.reservar(email, f, h, {admin: true}), "Agregado")) { await cargarAdmin(); renderAdmin(); }
}
async function agMover(id) {

    <label>Nueva fecha</label><input type="date" name="f" value="${r.fecha}">
    <label>Nuevo horario</label><select name="h"></select>`, ok: "Mover",
    onOpen: b => { const fi = b.querySelector("[name=f]"), hs = b.querySelector("[name=h]");

  if (f === r.fecha && h === r.hora) return;

    const otro = (await state.B.reservasRango(f, f)).find(x => x.email === r.email && x.id !== r.id);

    <div class="card"><b>Links</b>
      ${[["alumnos","App de alumnos (reservar, cambiar y cancelar turnos)"],["profes","App de profes (agenda, asistencia y efectivo)"],["duenas","App de dueñas (esta)"],["prueba","Clase de prueba (para la landing y redes, no es para alumnos)"]].map(([k, l]) => `<label>${l}</label>
        <div class="row"><input readonly value="${esc(LINKS[k])}" class="grow" style="width:auto;font-size:13px"><button class="btn sec sm" data-a="copiar" data-k="${k}">Copiar</button></div>`).join("")}</div>`;
}
async function addProfe() {
  const nombre = document.getElementById("pNom").value.trim(), email = document.getElementById("pMail").value.trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast("Poné un Gmail válido");
  if (await run(() => state.B.saveProfe({email, nombre}), "Profe agregada")) { await cargarAdmin(); renderAdmin(); }
}
async function saveCfg() {
  const g = id => document.getElementById(id);
  const c = {
    capacidad: Math.max(1, Number(g("cCap").value) || 1), intervalo: Math.max(5, Number(g("cInt").value) || 30),
    duracion: Math.max(5, Number(g("cDur").value) || 20), cancelMin: Math.max(0, Math.round(Number(g("cCan").value) || 0)),
    diasAnticipacion: Math.max(1, Number(g("cDias").value) || 30), maxSemana: Math.max(1, Number(g("cMaxSem").value) || 3), maxSeguidos: Math.max(1, Number(g("cMaxSeg").value) || 2), horarios: {},
    feriadosEx: state.cfg.feriadosEx || {}, horariosDesde: g("cDesde").value || "", horariosNuevos: {}
  };
  for (let d = 0; d < 7; d++) { c.horarios[String(d)] = g("cH" + d).value.trim(); c.horariosNuevos[String(d)] = g("cN" + d).value.trim(); }
  const malos = [...Object.values(c.horarios), ...Object.values(c.horariosNuevos)].filter(v => v && !v.split(",").every(r => /^\s*\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}\s*$/.test(r)));
  if (malos.length) return toast("Revisá el formato de horarios: " + malos[0]);
  if (await run(() => state.B.saveConfig(c), "Ajustes guardados")) { state.cfg = c; renderAdmin(); }
}

/* ============================ FICHA MÉDICA ============================ */
const vacio = v => !String(v ?? "").trim() || /^(no|ninguna|ninguno|nada|-|n\/a)\.?$/i.test(String(v).trim());
/* ---------- Alerta de la ficha médica en agenda y alumnos (dueñas y profes) ---------- */
// Rojo: marcó alguna condición médica. Naranja: toma medicación, tiene una lesión o dolor, o dejó otra aclaración.
const nivelFicha = f => {
  if (!f) return null;
  // Respuestas que en realidad dicen "no" ("No tomo medicación", "Ninguna", "Niguna", ".", etc.)
  const nada = v => { const t = String(v ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    return !t || /^[\s.\-_,;:!?]*$/.test(t) || /^(n|na|n\/a|no+|nada|nunca|sin|puse que\.? no)\b/.test(t) || /^n[iu]n?g?u?n[oa]?s?\b/.test(t); };
  if (!nada(f.condiciones)) return "rojo";
  const ms = String(f.medicacion || "").trim().toLowerCase(), med = ms.startsWith("s") || (!ms && !nada(f.cualMedicacion));
  return med || !nada(f.detalle) || !nada(f.lesion) || !nada(f.otra) ? "naranja" : null;
};
async function fichaDe(email) {
  const f = await state.B.getFicha(email);
  if (f) return f;
  const viejo = alumnoDe(email)?.mailSiguefit; // si cambió de mail, la ficha puede estar con el anterior
  return viejo ? state.B.getFicha(viejo) : null;
}
let fichasPend = null;
function alertaFicha(email) {
  if (!email) return "";
  email = String(email).trim().toLowerCase();
  state.fichas = state.fichas || {};
  if (!(email in state.fichas)) {
    state.fichas[email] = undefined;
    if (!fichasPend) { fichasPend = new Set(); setTimeout(async () => {
      const lista = [...fichasPend]; fichasPend = null;
      await Promise.all(lista.map(async m => { try { state.fichas[m] = nivelFicha(await fichaDe(m)); } catch (e) { state.fichas[m] = null; } }));
      if (lista.some(m => state.fichas[m]) && RUTA !== "alumnos" && !$modal.classList.contains("on")) renderAdmin();
    }, 0); }
    fichasPend.add(email);
    return "";
  }
  const n = state.fichas[email];
  if (!n) return "";
  const col = n === "rojo" ? "#ff3b30" : "#ff9500", tit = n === "rojo" ? "Ficha médica: tiene una condición médica (revisar antes de la clase)" : "Ficha médica: medicación, lesión u otra aclaración";
  return `<svg class="alf" width="16" height="16" viewBox="0 0 24 24" aria-label="${tit}"><title>${tit}</title><path fill="${col}" d="M12 2.5 1.5 21h21L12 2.5z"/><path fill="#fff" d="M11 9h2v6h-2zm0 7.5h2v2h-2z"/></svg>`;
}
function fichaHTML(f, mail) {
  if (!f) return `<div class="ficha"><b>📋 Ficha médica</b><p class="small muted" style="margin-top:6px">No encontramos una ficha completada con <b>${esc(mail)}</b>. Puede que haya usado otro mail en el formulario.</p></div>`;
  const fila = (t, v, alerta) => v == null || String(v).trim() === "" ? "" : `<dt>${t}</dt><dd class="${alerta ? "alerta" : ""}">${esc(v)}</dd>`;
  const cond = [f.condiciones, f.detalle].filter(x => !vacio(x)).join(" · ");
  const med = String(f.medicacion || "").trim().toLowerCase().startsWith("s") ? (f.cualMedicacion || "Sí") : (vacio(f.cualMedicacion) ? "No" : f.cualMedicacion);
  return `<div class="ficha"><b>📋 Ficha médica</b> <span class="small muted">· completada el ${esc(f.fecha || "—")}</span><dl>
    ${fila("Condiciones médicas", cond || "Ninguna", !!cond)}
    ${fila("Medicación", med, !vacio(med))}
    ${fila("Lesión o dolor actual", vacio(f.lesion) ? "No" : f.lesion, !vacio(f.lesion))}
    ${vacio(f.otra) ? "" : fila("Algo más que debamos saber", f.otra, true)}
    ${fila("Objetivo", f.objetivo)}
    ${fila("Hace actividad física", f.actividad)}
    ${fila("Edad · nacimiento", [f.edad, f.nacimiento].filter(Boolean).join(" · "))}
    ${fila("Altura · peso", [f.altura && f.altura + " cm", f.peso && f.peso + " kg"].filter(Boolean).join(" · "))}
    ${fila("DNI", f.dni)}
    ${fila("Teléfono", f.telefono)}
    ${fila("Autoriza uso de imagen", f.imagen || "Sin respuesta")}
    ${fila("Consentimiento firmado", [f.consentimiento, f.firma].filter(Boolean).join(" · "))}
  </dl></div>`;
}

/* ============================ EVENTOS ============================ */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-a]"); if (!el || el.closest("#modal")) return;
  const a = el.dataset.a, B = state.B;
  switch (a) {
    case "login": run(() => B.login()); break;
    case "mailModo": state.mailModo = el.dataset.m; renderLogin(); break;
    case "mailEntrar": { const d = datosMail(); if (!d) break;
      if (state.mailModo === "crear") { if (d.pass !== d.pass2) { toast("Las contraseñas no coinciden"); break; } await run(() => B.crearCuenta(d.email, d.pass)); }
      else await run(() => B.loginMail(d.email, d.pass));
      break; }
    case "mailOlvide": { const email = (document.getElementById("mMail")?.value || "").trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast("Escribí tu mail arriba y volvé a tocar acá"); break; }
      await run(() => B.recuperar(email), "Te mandamos un mail para crear una contraseña nueva (mirá también en spam)"); break; }
    case "verifListo": { const u = await B.recargar(); if (u.verificado) alEntrar(u); else toast("Todavía no figura confirmado. Tocá el link del mail y volvé a probar."); break; }
    case "verifReenviar": await run(() => B.reenviarVerif(), "Te lo mandamos de nuevo (mirá también en spam)"); break;
    case "demoLogin": B.login(el.dataset.k); break;
    case "demoReset": if (await modal({title: "¿Reiniciar la demo?", html: "<p>Se vuelven a cargar los datos de ejemplo.</p>", ok: "Reiniciar"})) { await B.reset(); location.reload(); } break;
    case "logout": state.unsub && state.unsub(); state.unsub = null; state.cambiando = null; await B.logout(); break;
    case "prDia": pr.dia = el.dataset.f; renderPrueba(); break;
    case "prSlot": prElegir(el.dataset.f, el.dataset.h); break;
    case "prOtra": pr.listo = null; try { localStorage.removeItem(PRUEBA_KEY); } catch (e) {} renderPrueba(); break;
    case "alta": { const r = resPorId(el.dataset.id); if (r) editarAlumno(null, {nombre: r.nombre, email: r.mail || "", telefono: r.telefono, notas: r.nota}); break; }
    case "dia": state.diaSel = el.dataset.f; renderAlumno(); break;
    case "semAl": state.semAl = addDays(state.semAl || lunesDe(hoy()), Number(el.dataset.d)); renderAlumno(); break;
    case "slot": clickSlot(el.dataset.f, el.dataset.h); break;
    case "cambiar": state.cambiando = state.mis.find(r => r.id === el.dataset.id); state.diaSel = null; renderAlumno(); toast("Elegí el nuevo día y horario"); break;
    case "noCambiar": state.cambiando = null; renderAlumno(); break;
    case "cancelar": {
      const r = state.mis.find(x => x.id === el.dataset.id); if (!r) return;
      if (!puedeModificar(r)) return toast("Ya no se puede cancelar este turno");
      if (await modal({title: "¿Cancelar turno?", html: `<p>${fmtLargo(r.fecha)} a las ${r.hora}</p>`, ok: "Sí, cancelar", cancel: "No", danger: true})) {
        await run(() => B.cancelar(r), "Turno cancelado"); state.cambiando = null; await refrescarMis(); }
      break; }
    case "tab": state.tab = el.dataset.t; renderAdmin(); break;
    case "agMove": state.agFecha = addDays(state.agFecha, Number(el.dataset.d)); await cargarAdmin(); renderAdmin(); break;
    case "agHoy": state.agFecha = hoy(); await cargarAdmin(); renderAdmin(); break;
    case "refresh": await cargarAdmin(); renderAdmin(); toast("Actualizado"); break;
    case "agAdd": agAgregar(el.dataset.h, el.dataset.f); break;
    case "vista": state.vista = el.dataset.v; renderAdmin(); break;
    case "agAddDia": agregarEnDia(el.dataset.f); break;
    case "persona": accionesPersona(el.dataset.id); break;
    case "agMover": agMover(el.dataset.id); break;
    case "agDel": quitarDelTurno(el.dataset.id); break;
    case "pago": registrarPago(el.dataset.id); break;
    case "feriado": {
      const c = JSON.parse(JSON.stringify(state.cfg)); c.feriadosEx = {...(c.feriadosEx || {}), [el.dataset.f]: el.dataset.v};
      if (await run(() => B.saveConfig(c), el.dataset.v === "cerrado" ? "Día cerrado" : "Día abierto")) {
        state.cfg = c; await cargarAdmin(); renderAdmin();
        const rs = el.dataset.v === "cerrado" ? (await B.reservasRango(el.dataset.f, el.dataset.f)) : [];
        if (rs.length) await modal({title: "Hay turnos reservados ese día", cancel: "", ok: "Entendido",
          html: `<p class="sub">No se borran solos. Avisales y movelos desde la Agenda:</p>${rs.map(r => { const tel = telRes(r), nom = nombreRes(r);
            return `<div class="person"><span class="name">${r.hora} · ${esc(nom)}</span>${tel ? `<a class="att" target="_blank" href="${waLink(tel, `Hola ${nom.split(" ")[0]}! Te escribimos de PowerFit: el ${fmtLargo(r.fecha)} el gimnasio está cerrado. ¿Te pasamos el turno a otro día?`)}">WhatsApp</a>` : ""}</div>`; }).join("")}`});
      }
      break; }
    case "copiar": try { await navigator.clipboard.writeText(LINKS[el.dataset.k]); toast("Link copiado"); } catch (err) { toast("No se pudo copiar: copialo a mano"); } break;
    case "addProfe": addProfe(); break;
    case "delProfe": if (await modal({title: "¿Quitar profe?", html: `<p>${esc(el.dataset.e)} ya no va a poder entrar al panel.</p>`, ok: "Quitar", danger: true}))
      if (await run(() => B.deleteProfe(el.dataset.e), "Profe quitada")) { await cargarAdmin(); renderAdmin(); } break;
    case "att": marcarAsistencia(el.dataset.id, el.dataset.v === "1"); break;
    case "verDia": state.agFecha = el.dataset.f; state.tab = "agenda"; await cargarAdmin(); renderAdmin(); break;
    case "copiarLink": try { await navigator.clipboard.writeText(location.origin + location.pathname + "#prueba"); toast("Link copiado"); } catch (err) { toast("No se pudo copiar: copialo a mano"); } break;
    case "filtro": state.filtro = el.dataset.k; renderAdmin(); break;
    case "alNuevo": editarAlumno(null); break;
    case "alEdit": editarAlumno(el.dataset.e); break;
    case "alTurnos": turnosAlumna(el.dataset.e); break;
    case "compSubir": subirComprobante(); break;
    case "mPrev": verPreviaMail(); break;
    case "mEnviar": enviarMailMasivo(); break;
    case "mGuardarPl": guardarPlantilla(); break;
    case "mBorrarPl": if (await modal({title: "¿Borrar la plantilla?", ok: "Borrar", danger: true})) { if (await run(() => B.deletePlantilla(el.dataset.id), "Plantilla borrada")) { leerBorrador(); await cargarAdmin(); renderAdmin(); } } break;
    case "compVer": verComprobante(el.dataset.id); break;
    case "compOk": aprobarComprobante(el.dataset.id); break;
    case "compNo": rechazarComprobante(el.dataset.id); break;
    case "mpVincular": {
      const id = el.dataset.id, email = document.getElementById("mpSel_" + id)?.value;
      if (!email) { toast("Elegí la alumna"); break; }
      const antes = state.alumnos.find(a => a.mpSuscripcion === id)?.email;
      if (await run(() => B.vincularMp(id, email, antes), "Listo: cuando Mercado Pago cobre, se renueva solo")) { await cargarAdmin(); renderAdmin(); }
      break; }
    case "addBloq": addBloqueo(); break;
    case "delBloq": if (await run(() => B.deleteBloqueo(el.dataset.id), "Bloqueo quitado")) { await cargarAdmin(); renderAdmin(); } break;
    case "saveCfg": saveCfg(); break;
    case "verFicha": { const f = await fichaDe(el.dataset.e); modal({title: "Ficha de " + (el.dataset.n || el.dataset.e), html: fichaHTML(f, el.dataset.e), ok: "", cancel: "Cerrar"}); break; }
  }
});
document.addEventListener("change", async e => {
  if (e.target.id === "agDate" && e.target.value) { state.agFecha = e.target.value; await cargarAdmin(); renderAdmin(); }
  if (e.target.id === "bTodo") document.getElementById("bHoras").style.display = e.target.checked ? "none" : "grid";
  if (e.target.id === "mPl" && e.target.value) { const t = todasPlantillas().find(x => x.id === e.target.value);
    if (t) { const d = leerBorrador(); state.mailDraft = {...d, asunto: t.asunto, cuerpo: t.cuerpo}; renderAdmin(); } }
  if (e.target.id === "mPara" || e.target.id === "mBoton") { leerBorrador(); renderAdmin(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { state.q = e.target.value; state._focusQ = true; renderAdmin(); state._focusQ = false; }
  if (e.target.id === "mAsunto" || e.target.id === "mCuerpo") leerBorrador(); // no se pierde lo escrito al cambiar de pestaña
});
// Refresca la vista del alumno cada minuto (para que los turnos pasados se actualicen)
setInterval(() => { if (state.user && RUTA === "alumnos" && state.alumno && !$modal.classList.contains("on")) renderAlumno(); }, 60e3);

/* ============================ ARRANQUE ============================ */
async function alEntrar(u) {
  state.user = u;
  if (!u) return renderLogin();
  if (!state.B.demo && u.verificado === false) return renderVerificar();
  $app.innerHTML = `<div class="login">${LOGO}<p class="muted">Cargando…</p></div>`;
  try {
    state.cfg = await state.B.getConfig();
    state.bloqueos = await state.B.listBloqueos();
    state.admin = await state.B.isAdmin();
    state.profe = !state.admin && await state.B.isProfe();
    state.rol = state.admin ? "admin" : state.profe ? "profe" : "alumno";
    const nuevoCfg = state.cfg._nuevo; delete state.cfg._nuevo;
    if (state.admin && nuevoCfg) await state.B.saveConfig(state.cfg); // primera vez: guarda la configuración inicial
    if (RUTA === "duenas") {
      if (state.rol === "profe") return renderSinAcceso(`Esta es la app de dueñas. Las profes tienen su propia app.`, "Ir a la app de profes", LINKS.profes);
      if (state.rol !== "admin") return renderSinAcceso(`La cuenta <b>${esc(u.email)}</b> no tiene acceso a esta app.`, "Ir a mis turnos", LINKS.alumnos);
      state.tab = "agenda"; state.agFecha = hoy(); await cargarAdmin(); return renderAdmin();
    }
    if (RUTA === "profes") {
      if (state.rol === "alumno") return renderSinAcceso(`La cuenta <b>${esc(u.email)}</b> no tiene acceso a la app de profes.`, "Ir a mis turnos", LINKS.alumnos);
      state.rol = "profe"; // las dueñas también pueden entrar, y ven exactamente lo mismo que una profe
      state.tab = "agenda"; state.agFecha = hoy(); await cargarAdmin(); return renderAdmin();
    }
    state.alumno = await state.B.getAlumno(u.email);
    if (!state.alumno && state.rol === "admin") return renderSinAcceso("Esta es la app de alumnos. La de dueñas tiene su propio link.", "Ir a la app de dueñas", LINKS.duenas);
    if (!state.alumno && state.rol === "profe") return renderSinAcceso("Esta es la app de alumnos. Las profes tienen su propia app.", "Ir a la app de profes", LINKS.profes);
    state.admin = false;
    if (!state.alumno) return renderNoAlta();
    state.mis = await state.B.misReservas();
    state.comps = await state.B.misComprobantes().catch(e => { console.warn(e); return []; });
    state.diaSel = null;
    suscribirTurnos();
    renderAlumno();
  } catch (e) {
    console.error(e);
    $app.innerHTML = `${header(u.email)}<div class="wrap"><div class="card center"><p>No se pudo cargar la información.</p><p class="sub">${esc(traducirError(e))}</p>
      <button class="btn" style="margin-top:12px" onclick="location.reload()">Reintentar</button></div></div>`;
  }
}
(async () => {
  try { state.B = FIREBASE_CONFIG.apiKey ? await firebaseBackend() : demoBackend(); }
  catch (e) { console.error(e); $app.innerHTML = `<div class="login">${LOGO}<p>No se pudo conectar. Revisá tu conexión.</p></div>`; return; }
  if (RUTA === "prueba") arrancarPrueba(); else state.B.init(alEntrar);
})();
window.addEventListener("hashchange", () => location.reload());
</script>
